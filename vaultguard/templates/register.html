{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<section class="auth card">
  <h1>Create account</h1>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Username <input name="username" value="{{ username }}" autocomplete="username" required></label>
    <label>Password <input name="password" type="password" autocomplete="new-password" required></label>
    <p class="muted small">At least 10 characters with upper case, lower case, a digit and a special character. Common passwords and passwords containing the username are refused.</p>
    <button class="btn">Register</button>
  </form>
  <p class="muted small">Have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</section>
{% endblock %}
